{% extends "base.html" %}
{% block title %}{{ code }} · {{ app_name }}{% endblock %}

{% block content %}
<div class="flex min-h-[50vh] flex-col items-center justify-center text-center">
  <p class="text-6xl font-black tracking-tight text-slate-200">{{ code }}</p>
  <h1 class="mt-3 text-lg font-bold text-slate-900">{{ message }}</h1>
  <p class="mt-1 text-sm text-slate-500">Adres yanlış olabilir ya da kayıt silinmiş olabilir.</p>
  <a href="{{ url_for('panel.index') }}" class="btn-primary mt-5">Panele dön</a>
</div>
{% endblock %}
